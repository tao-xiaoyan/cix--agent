services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_DB: ${POSTGRES_DB:-health_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: cloud-platform/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-health_monitor}
      CURSOR_SECRET: ${CURSOR_SECRET:?Generate .env first}
      CLOUD_IDENTITIES: ${CLOUD_IDENTITIES:?Generate .env first}
      MOCK_WORKER_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    ports: ["127.0.0.1:5174:80"]
    depends_on: [api]
volumes:
  postgres_data:
